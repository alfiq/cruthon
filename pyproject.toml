[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cruthon"
version = "0.1.0"
description = "Cruthon: un lenguaje de programación basado en teoría de conjuntos, interpretado como Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "alfiq", email = "luisfable@yahoo.com.mx" }]
keywords = ["lenguaje", "conjuntos", "interprete", "sets", "lisp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=4", "reportlab>=4"]
pdf = ["pypdf>=4", "reportlab>=4"]

[project.scripts]
cruthon = "cruthon.cli:main"

[tool.setuptools]
packages = ["cruthon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
